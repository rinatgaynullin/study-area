name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + vitest + build all packages, including the standalone one
      - run: npm run ci

      - name: Build demo
        run: npm run build:demo

      # The standalone build is meant for hosts without a bundler: check it in
      # a real browser served as plain static files.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke-test the standalone build
        run: npm run smoke:standalone

  django:
    name: django-rich-editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -e 'packages/django-rich-editor[test]'

      - run: pytest
        working-directory: packages/django-rich-editor

  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The demo runs against package sources, so no build step is needed first.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=${{ matrix.project }}

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
