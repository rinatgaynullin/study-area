name: Deploy demo

on:
  push:
    branches: [main]
  # Lets the demo be published from a branch before it is merged.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment half-way; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Switches the repository's Pages source to GitHub Actions on the
          # first run, so publishing needs no manual step in Settings.
          enablement: true

      - name: Build demo
        # base_path is "" for a user site and "/<repo>" for a project site;
        # Vite wants it with a trailing slash.
        run: npm run build:demo
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/demo/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
